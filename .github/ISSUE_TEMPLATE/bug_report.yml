name: Bug report
description: Something in Whos is not working as expected
labels: [bug]
body:
  - type: input
    id: whos-version
    attributes:
      label: Whos version
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen? Include steps to reproduce if you can.
    validations:
      required: true
